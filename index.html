/* Screenshot-matched floating navigation and notification control */
.bottom-nav{position:absolute;z-index:5;bottom:calc(40px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:7px;width:max-content;max-width:calc(100% - 26px);background:transparent}
.bottom-nav .nav-pill{display:flex;align-items:center;padding:5px;background:#383838;border-radius:999px;width:208px;height:82px;gap:0}
.bottom-nav .navbutton{width:50%;min-width:0;height:72px;margin:0!important;border-radius:999px!important;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#bcbcbc;font-size:14px;font-weight:650;transition:background .15s,color .15s}
.bottom-nav .navbutton.active{background:#1b1b1b;color:#fff}
.bottom-nav .navbutton svg{height:27px;width:27px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav .qrbutton{width:82px;height:82px;flex:0 0 82px;border-radius:50%;background:#383838;display:grid;place-items:center}
.bottom-nav .qrbutton svg{width:29px;height:29px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linejoin:round}
.bell{width:54px;height:54px;display:grid;place-items:center;background:#373737;border:1px solid #4b4b4b}
.bell svg{width:30px;height:30px;fill:none;stroke:white;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell b{min-width:25px;height:25px;right:-4px;top:-6px;display:grid;place-items:center;padding:0 5px;background:#d90025;font-size:13px;line-height:1}
.bell b[hidden]{display:none}
.home-indicator{bottom:10px;height:5px;width:36%;left:32%;background:#606060}
main{padding-bottom:115px}
.notification-item{padding:14px 0;border-bottom:1px solid #454545}
.notification-item strong{display:block;margin-bottom:4px}
.notification-item p{margin:0;font-size:14px}
.notification-item small{color:#a9a9a9}
@media(min-width:390px){.bottom-nav .nav-pill{width:226px;height:86px}.bottom-nav .navbutton{height:76px}.bottom-nav .qrbutton{width:86px;height:86px;flex-basis:86px}}

/* Screenshot-inspired PayPal card branding and rounded typography */
.paypal-mark{width:56px;height:43px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:7px;overflow:hidden;padding:4px}
.paypal-mark img{display:block;max-width:100%;max-height:100%;width:38px;height:38px;object-fit:contain;mix-blend-mode:multiply}
h1{font-size:clamp(27px,6.8vw,38px);font-weight:800;letter-spacing:-1.35px}
.tabs button{font-size:16px;font-weight:400;letter-spacing:-.25px}
.tabs button.selected{font-weight:700}
.balance-top{font-size:17px;font-weight:500}
.balance-amount{font-size:43px;font-weight:800;letter-spacing:-1.7px}
.section-heading h2,.settings-title{font-size:22px;font-weight:600;letter-spacing:-.35px}
.row-name{font-size:17px;font-weight:400}
.row-detail{font-size:16px}
.empty h2{font-size:30px;font-weight:800}
.subscriptions h2{font-size:34px;font-weight:800}
.bottom-nav .navbutton{font-size:15px;font-weight:600}
@media(max-width:370px){.tabs button{font-size:13px;padding:12px 8px}h1{font-size:27px}}

/* Fluid segmented navigation and page transitions */
.tabs{position:relative;isolation:isolate;overflow:visible}
.tabs .tab-glider{position:absolute;z-index:-1;top:0;left:0;height:100%;border-radius:999px;background:#383838;transition:transform 340ms cubic-bezier(.22,1,.36,1),width 340ms cubic-bezier(.22,1,.36,1);pointer-events:none;will-change:transform,width}
.tabs button{position:relative;z-index:1;transition:color 260ms ease, font-weight 260ms ease;background:transparent!important;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tabs button.selected{color:#fff}
.tabs button:focus-visible,.bottom-nav button:focus-visible{outline:2px solid #20c8ef;outline-offset:3px}
.bottom-nav .navbutton{transition:background 300ms ease,color 300ms ease,transform 300ms ease}
.bottom-nav .navbutton:active,.tabs button:active{transform:scale(.97)}
@media(prefers-reduced-motion:reduce){.tabs .tab-glider,.tabs button,.bottom-nav .navbutton{transition:none!important}}

const state={view:'me',tab:'Accounts',sendTab:'Transfer',amount:'0',currency:'PHP',push:false,biometrics:true,unread:1};
const $=s=>document.querySelector(s);const content=$('#content');
const menu=['Accounts','Activity','Subscriptions','Settings'];
function row(name,detail='',action=name,right='›'){return `<button class="list-row" data-modal="${action}"><span class="row-copy"><span class="row-name">${name}</span>${detail?`<span class="row-detail">${detail}</span>`:''}</span><span class="chevron">${right}</span></button>`}

let lastTabView=null;
function tabs(){
 const nav=$('#topTabs'),opts=state.view==='me'?menu:['Transfer','Contacts','More'];
 if(lastTabView!==state.view){
  nav.innerHTML='<span class="tab-glider" aria-hidden="true"></span>'+opts.map(t=>`<button data-tab="${t}">${t}</button>`).join('');
  lastTabView=state.view;
 }
 const selected=state.view==='me'?state.tab:state.sendTab;
 nav.querySelectorAll('button').forEach(b=>{const active=b.dataset.tab===selected;b.classList.toggle('selected',active);b.setAttribute('aria-current',active?'page':'false')});
 const b=nav.querySelector('button.selected'),glider=nav.querySelector('.tab-glider');
 if(b&&glider){if(!glider.dataset.ready){glider.style.transition='none';glider.style.width=b.offsetWidth+'px';glider.style.transform=`translateX(${b.offsetLeft}px)`;glider.offsetHeight;glider.style.transition='';glider.dataset.ready='1'}else{glider.style.width=b.offsetWidth+'px';glider.style.transform=`translateX(${b.offsetLeft}px)`}}
}
function switchScreen(){
 render();
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 content.getAnimations().forEach(a=>a.cancel());
 content.animate([{opacity:.3,transform:'translateY(10px) scale(.992)',filter:'blur(2px)'},{opacity:1,transform:'translateY(0) scale(1)',filter:'blur(0px)'}],{duration:320,easing:'cubic-bezier(.22,1,.36,1)'});

const receivedPayments=[{amount:10000.25,date:'29 Oct',dateFull:'29 October 2026'},{amount:20000.50,date:'27 Oct',dateFull:'27 October 2026'},{amount:11000.18,date:'25 Oct',dateFull:'25 October 2026'},{amount:9230.30,date:'23 Oct',dateFull:'23 October 2026'}];
function activity(){return `<section class="activity-wrap"><div class="activity-search"><span aria-hidden="true">⌕</span><input id="activitySearch" type="search" placeholder="Search transactions" aria-label="Search transactions"><button data-modal="Activity filters" aria-label="Filter activity">☷</button></div><div class="activity-group-title">Completed <span class="activity-count">4 payments</span></div><div id="transactionList">${receivedPayments.map((tx,i)=>`<div class="tx-date">${tx.dateFull}</div><button class="activity-transaction" data-transaction="${i}"><span class="activity-transaction-icon">⇄</span><span class="activity-transaction-info"><strong>Money received</strong><small>${tx.date} · Payment · Completed</small></span><span class="activity-positive">+₱${tx.amount.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></button>`).join('')}</div><p class="activity-no-results" id="activityNoResults" hidden>No matching transactions.</p><p class="sample-record-disclosure">Illustrative transaction records · Not connected to PayPal</p></section>`}
function subscriptions(){return `<div class="subscriptions"><div class="subscription-art">🟦 🟥<br>🟩 🟠</div><h2>Stay on top of your subscriptions</h2></div>`}
function settings(){return `<div class="profile-head"><h2 class="settings-title">Profile</h2><button class="switch" data-modal="Switch accounts">⇄ Switch accounts</button></div>${group(row('Name','Jebie Briones Julaton','Name','')+row('Profile photo',"Update your photo so friends and merchants know it's you")+row('Email','Unconfirmed — verify your email address')+row('Phone number','Manage your phone number')+row('Address','Manage your billing address')+row('PayPal.me','Create your personal profile.')+row('Profile visibility','Manage who can find your PayPal profile.'))}<h2 class="settings-title">Security and privacy</h2>${group(`<div class="subheading">Manage your account’s security</div>`+row('Passkeys','Log in without a password across devices.')+`<button class="list-row" id="bioToggle"><span class="row-copy"><span class="row-name">Biometrics</span><span class="row-detail">Log in faster with your face or fingerprint.</span></span><span class="toggle">${state.biometrics?'On':'Off'}</span></button>`+row('Password','Create a new password.')+row('Blocked contacts','Control who can contact you')+`<div class="subheading">Manage your collected & shared data</div>`+row('Connected apps and sites','Manage how connected services use your PayPal data.')+row('Download or delete your data','Manage your data collected by PayPal.'))}<h2 class="settings-title">Notification preferences</h2>${group(`<button class="list-row" id="pushToggle"><span class="row-copy"><span class="row-name">Receive push notifications</span><span class="row-detail">Get timely updates from PayPal, straight to your device.</span></span><span class="toggle">${state.push?'On':'Turn On'}</span></button><div class="subheading">General notifications</div>`+row('Push notifications')+row('Account SMS and email')+row('Marketing SMS and email'))}<h2 class="settings-title">Support</h2>${group(row('Chat with PayPal Assistant','Get instant help from our AI assistant.')+row('Message Center','View conversations and updates from PayPal.')+row('Help Center','Get help with your account, transactions, and more.'))}<button class="logout" data-modal="Log Out">⇥ Log Out</button><button class="close-account" data-modal="Close account">▤ Close account</button><div class="settings-bottom"><a href="#" id="legalLink">Legal</a><p>Demo version 1.0</p></div>`}
function transfer(){return `<div class="send-screen"><div class="send-amount"><div class="amount"><sup>${state.currency==='PHP'?'₱':'$'}</sup>${state.amount}</div><button class="currency" id="currencyBtn">🇵🇭 ${state.currency} ﹀</button></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(n=>`<button data-key="${n}">${n}</button>`).join('')}</div><div class="send-actions"><button data-modal="Request payment">Request</button><button data-modal="Send payment">Send</button></div><div class="notice">UI demonstration — no money will be sent or requested.</div></div>`}
function sendOther(){return state.sendTab==='Contacts'?`<div class="empty"><div class="empty-icon">♙</div><h2>Your contacts</h2><p>No contacts added in this demonstration.</p><button class="primary" data-modal="Add contact">Add contact</button></div>`:`${group(row('Request money','Create a payment request')+row('Scan QR code','Open QR code')+row('Payment links','Manage payment links'))}`}
function render(){const isMe=state.view==='me';$('#pageTitle').textContent=isMe?'Jebie Briones Julaton':'Send';tabs();content.innerHTML=isMe?({Accounts:accounts,Activity:activity,Subscriptions:subscriptions,Settings:settings}[state.tab]()):(state.sendTab==='Transfer'?transfer():sendOther());$('#meNav').classList.toggle('active',isMe);$('#sendNav').classList.toggle('active',!isMe);$('#bellBadge').hidden=state.unread===0;$('#bellBadge').textContent=state.unread;content.scrollTop=0;}
function modal(title){$('#modalTitle').textContent=title;const generic='This is an interactive interface demonstration. Connect a secure backend and approved payment provider to enable this feature.';let body=`<p>${generic}</p>`;if(title==='Send payment'||title==='Request payment')body=`<p>${title} of ${state.currency} ${state.amount}. This demo does not process payments.</p><input aria-label="Recipient" placeholder="Email or mobile number"><button class="primary" id="demoConfirm">Preview only</button>`;if(title==='Notifications')body=`<div class="notification-item"><strong>Welcome to your wallet</strong><p>This is a sample notification for the interface demo.</p><small>Demo notification</small></div><button class="primary" id="markRead">Mark as read</button><p class="notice">Notifications are local demo content, not PayPal messages.</p>`;if(title.startsWith('Received payment ')){const tx=receivedPayments[Number(title.split(' ').at(-1))];if(tx)body=`<p><strong>Sample money received: +₱${tx.amount.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}</strong></p><p>${tx.dateFull} · Completed</p><p>Illustrative interface entry; no real transaction or receipt exists.</p>`;}if(title==='Activity filters')body='<p>The Activity page shows four illustrative received payments totaling ₱50,231.23. Search by amount or date.</p>';if(title==='Link bank or card')body='<p>For security, bank details are not collected by this demo. Use the official PayPal app to link financial accounts.</p>';if(title==='QR code')body='<p>QR functionality is a placeholder in this demo.</p>';if(title==='Email')body='<p>Your example screenshot shows an unconfirmed email. Verify your address in the official PayPal app.</p>';if(title==='Log Out')body='<p>This is a local demonstration with no active login session.</p>';$('#modalBody').innerHTML=body;$('#modal').showModal();}
document.addEventListener('click',e=>{const btn=e.target.closest('button,a');if(!btn)return;if(btn.dataset.view){if(state.view!==btn.dataset.view){state.view=btn.dataset.view;switchScreen()}}else if(btn.dataset.tab){if(state.view==='me'){if(state.tab!==btn.dataset.tab){state.tab=btn.dataset.tab;switchScreen()}}else if(state.sendTab!==btn.dataset.tab){state.sendTab=btn.dataset.tab;switchScreen()}}else if(btn.dataset.modal){modal(btn.dataset.modal)}else if(btn.dataset.key){let k=btn.dataset.key;if(k==='⌫')state.amount=state.amount.slice(0,-1)||'0';else if(k==='.'&&!state.amount.includes('.'))state.amount+='.';else if(/[0-9]/.test(k)&&state.amount.replace('.','').length<9)state.amount=state.amount==='0'?k:state.amount+k;$('.amount').innerHTML=`<sup>${state.currency==='PHP'?'₱':'$'}</sup>${state.amount}`;}else if(btn.dataset.transaction!==undefined){modal('Received payment '+btn.dataset.transaction)}else if(btn.id==='currencyBtn'){state.currency=state.currency==='PHP'?'USD':'PHP';render()}else if(btn.id==='pushToggle'){state.push=!state.push;render()}else if(btn.id==='bioToggle'){state.biometrics=!state.biometrics;render()}else if(btn.id==='markRead'){state.unread=0;$('#bellBadge').hidden=true;$('#modalBody').innerHTML='<p>No unread notifications.</p>'}else if(btn.id==='closeModal'){$('#modal').close()}else if(btn.id==='demoConfirm'){$('#modalBody').innerHTML='<p>Preview complete. No transaction was created.</p>'}else if(btn.id==='legalLink'){e.preventDefault();modal('Legal')}});
document.addEventListener('input',e=>{if(e.target.id==='activitySearch'){const q=e.target.value.trim().toLowerCase();let count=0;document.querySelectorAll('[data-transaction]').forEach(b=>{const idx=Number(b.dataset.transaction),tx=receivedPayments[idx],show=(!q||['received','money received',String(tx.amount),tx.amount.toLocaleString('en-PH'),tx.date.toLowerCase(),tx.dateFull.toLowerCase(),'payment','completed'].some(v=>v.includes(q)));b.hidden=!show;const date=b.previousElementSibling;if(date)date.hidden=!show;if(show)count++;});$('#activityNoResults').hidden=count!==0;}});render();

</script></body></html>
